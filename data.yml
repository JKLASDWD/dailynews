news:
- 英格兰女王伊丽莎白一世颁授皇家特许状给不列颠东印度公司，赋予该公司贸易垄断权。
- 英国女王维多利亚选择小型伐木城镇渥太华为殖民地加拿大省的省会。
- 奥地利维也纳爱乐乐团在金色大厅举行首场维也纳新年音乐会，由克莱门斯·克劳斯担任指挥。
- 鲍里斯·叶利钦宣布辞去俄罗斯总统一职，总理弗拉基米尔·普京成为代理总统。
- 座落于台湾台北市信义区的台北101正式启用，为当时世界上最高的摩天大楼。
