news:
- 企图刺杀英格兰国王詹姆士一世的天主教教徒盖伊·福克斯遭到处决。
- 约翰·马歇尔成为第四任美国首席大法官，往后确立美国最高法院在《美国宪法》中的权力分立位置。
- 南斯拉夫联邦人民共和国通过新宪法，确立采用6个共和国组成的联邦制。
- 中共中央机关报《人民日报》全文刊发《汉字简化方案》，中华人民共和国国务院同时决定自次日起全面推行简化字。
- 苏联第一颗在月球上成功实现软着陆的探测器月球9号在拜科努尔发射场发射升空。
