news:
- 在推翻尼基弗鲁斯三世后，东罗马帝国将领阿莱克修斯一世加冕成为新任皇帝。
- 英国女王伊丽莎白一世赐予完成环球航海的弗朗西斯·德雷克皇家爵士头衔。
- 美国总统威廉·亨利·哈里森在就职一个月后逝世，引发总统继任问题的宪政危机。
- 美国、加拿大和十个欧洲国家签署《北大西洋公约》，建立北大西洋公约组织。
- 美国民权运动领袖马丁·路德·金在田纳西州孟菲斯旅馆内遭遇刺杀身亡。
