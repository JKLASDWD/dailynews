news:
- 法国-西班牙联军在比利亚维西奥萨战役中击败奥格斯堡同盟，确立了费利佩五世的统治地位，西班牙正式进入波旁王朝。
- 英国威斯敏斯特宫前街道交会处设置类似铁路信号机的煤气灯，为世界第一盏交通信号灯。
- 根据瑞典化学家阿尔弗雷德·诺贝尔遗嘱，在其逝世五周年纪念日设立第一届诺贝尔奖。
- 英国国王爱德华八世为了迎娶美国失婚名流沃利斯·辛普森而签署退位文件，成为英国史上唯一自愿退位的君主。
- 台湾党外运动人士在高雄市发起游行演讲期间发生严重警民冲突，随后中华民国政府对党外运动人士展开大规模逮捕与审判。
