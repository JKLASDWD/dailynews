news:
- 瓦剌太师也先率领蒙古军队击败太监王振统领的明朝军队，在土木堡之变擒获御驾亲征的明英宗。
- 统治法国长达72年的法国国王路易十四在巴黎凡尔赛宫逝世，由曾孙路易十五继承王位。
- 日本关东地方发生里氏震级7.8级的强烈地震，估计造成10万人至14万人死亡。
- 纳粹德国军队自维隆和西盘半岛发动大型攻势入侵波兰，第二次世界大战在欧洲爆发。
- 苏联空军的Su-15截击机在库页岛附近击落偏离航线的大韩航空007号班机，造成269人死亡。
