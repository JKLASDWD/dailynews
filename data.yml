news:
- 马丁·路德在维滕贝格的教堂门口张贴《九十五条论纲》。这标志着宗教改革的开端。
- 墨西哥第一帝国皇帝阿古斯汀一世宣布解散议会，并实行以他为首的军事独裁统治。
- 比利时-法国联军在伊瑟河战役击败德军，使得比利时能够保留部分领土不被占领。
- 位于美国南达科他州的拉什莫尔山雕像完工，分别是华盛顿、杰斐逊、老罗斯福和林肯。
- 纪念印度独立运动领导者萨达尔·瓦拉巴伊·帕特尔的团结雕像在古吉拉特邦那尔马达县正式落成，它高达182米，是全球最高的雕像。
