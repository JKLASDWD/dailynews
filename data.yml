- 不满宦官专权的唐文宗联合李训和郑注欲加以铲除，但反而造成数百名官员遭到杀害。
- 尼德兰与日耳曼北部沿岸发生严重风暴潮，造成约5万至8万人死亡，并形成今日的须德海。
- 德国物理学家马克斯·普朗克提出普朗克黑体辐射定律，认为能量将以量子散发电磁辐射。
- 挪威探险家罗尔德·阿蒙森所率领的南极探险队成为第一批到达南极点的人类。
- 波斯尼亚和黑塞哥维那、克罗地亚与塞尔维亚三方于巴黎签署和平协定，从而结束波斯尼亚战争。
