news:
- 位于土耳其以弗所、古代世界七大奇迹之一的阿耳忒弥斯神庙遭到赫罗斯特拉特纵火烧毁。
- 法国将军拿破仑·波拿巴于入侵埃及期间在金字塔战役击败马穆鲁克。
- 四国代表在日内瓦会议签署《印度支那停战协定》，决定以非军事区划分北越和南越。
- 在历经长达11年的兴建后，位于埃及阿斯旺、横跨尼罗河的阿斯旺水坝正式竣工。
- 中国人民解放军向台湾北部海域实施导弹发射演习，台湾海峡导弹危机爆发。
