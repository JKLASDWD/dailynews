news:
- 蒙古帝国可汗忽必烈下诏更改国号为“大元”，建立疆域横跨蒙古与中国的元朝。
- 俄国作曲家彼得·柴可夫斯基作曲的芭蕾舞剧《胡桃夹子》于圣彼得堡马林斯基剧院首次公演。
- 法国军队在东北部城镇凡尔登附近击败德军，结束了第一次世界大战中持续时间最长，最血腥的战斗之一。
- 杜聿明率领的中国国民革命军第五军反攻日本军队占领的昆仑关，昆仑关战役爆发。
- 美国空军对北越首都河内及其周边地区展开大规模轰炸，以争取在巴黎和平谈判的主动权。
