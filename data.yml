news:
- 在耶律斜轸和韩德让协助下，辽圣宗的母亲萧绰实质掌握辽朝政治权力。
- 法国国王腓力四世下令逮捕各地的圣殿骑士团成员，并强迫后者“承认”异端罪名。
- 犹太语言学家艾利泽·本-耶胡达在巴勒斯坦推行希伯来语，促成希伯来语复兴运动的发展。
- 中华民国政党民主进步党于全国党员代表大会通过《台独党纲》，主张透过公民投票实现台湾独立。
- 泰国历史上统治时间最长的国君普密蓬·阿杜德在曼谷诗里拉吉医院逝世，他成为了世界史上在任时间第二长的国家元首。
