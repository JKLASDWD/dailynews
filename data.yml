news:
- 苏格兰国王罗伯特一世率领的军队在班诺克本战役击败英格兰国王爱德华二世的军队。
- 意大利航海家乔瓦尼·卡博托接受英格兰国王亨利七世的委托出海，并成功发现北美洲。
- 法兰西第一共和国国民公会通过《共和元年宪法》，但因法国大革命形势严峻暂缓实行。
- 暹罗立宪派人士和军人发动不流血的立宪革命，结束拉达那哥欣王国的君主专制。
- 苏联对由美国、英国和法国占领的西柏林展开封锁行动，切断连接东柏林等地的货运交通。
