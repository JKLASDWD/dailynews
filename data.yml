news:
- 在有关免除阿姆斯特尔河大坝通行费的文件中，第一次提到“阿姆斯特丹”的名称。
- 美国纽约地铁第一条地下路线段落正式开通，连接纽约市政厅到哈莱姆。
- 台湾赛德克族头目莫那·鲁道联合各个部落在雾社公学校等地袭击日本人，为日治时期台湾最后一次武装抗日事件。
- 美国国家航空航天局为进入地心轨道研制的土星1号运载火箭首次在卡纳维拉尔角发射升空。
- 在独立公投后，加泰罗尼亚单方面宣布脱离西班牙独立建国。西班牙政府指行为违宪，并根据《西班牙宪法》155条接管加泰罗尼亚、冻结自治权。
