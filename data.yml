news:
- 唐朝藩镇安禄山与其部将史思明以清君侧之名发动叛乱，长达8年的内战成为唐朝由盛转衰的转捩点。
- 日本富士山发生至今最后一次大喷发，估计降下近8亿立方米的火山灰。
- 十三殖民地居民不满英国政府允许英国东印度公司垄断茶叶贸易，将该公司运来的茶叶倾倒入海。
- 中国甘肃省发生矩震级8.5级的强烈地震，造成273,400人死亡。
- 印度一名女性医学生于德里乘坐公交时遭到殴打与轮奸，并于13日后死亡，导致印度各地陆续爆发大规模示威抗议。
