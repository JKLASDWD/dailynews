news:
- 蒂雷纳子爵统帅的法兰西军在沙丘战役中对西班牙军取得决定性胜利，法国正式取代西班牙帝国成为欧洲霸主。
- 在美国独立战争期间，第二届大陆会议决议采用星条旗设计作为革命过后的美国国旗。
- 法国皇帝拿破仑一世率领的军队在弗里德兰战役中击败第四次反法同盟的俄罗斯军队。
- 阿根廷军队在马尔维纳斯群岛首府斯坦利向英国军队无条件投降，马岛战争结束。
- 西德、法国、比利时、荷兰、卢森堡五国在申根签署彼此取消边境检查的《申根协议》。
