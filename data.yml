news:
- 在教宗格里高利十三世颁行教宗诏书，数个天主教国家依据诏书改用如今通用的格里高利历，当天的日期变为10月15日。
- 首列欧洲长程列车东方快车从法国首都巴黎出发，开往奥斯曼帝国首都伊斯坦布尔。
- 葡萄牙共和党发动革命并建立第一共和国，末代国王曼纽二世逃往英国直布罗陀。
- 苏联斯普特尼克1号在拜科努尔航天发射场发射升空，为首颗绕地球运行的人造卫星。
- 澳大利亚记者朱利安·阿桑奇创立维基解密，该网站与维基百科无关。
