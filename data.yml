news:
- 法兰西公爵于格·卡佩被正式推举为西法兰克王国国王，建立法兰西王国卡佩王朝。
- 法国探险家萨米埃尔·德·尚普兰建立魁北克市，此地成为法国殖民地新法兰西的首府。
- 美利坚联盟国将军罗伯特·李命令联盟军发动皮克特冲锋失败，联邦军在葛底斯堡战役赢得胜利。
- 普鲁士军队在克尼格雷茨战役中击败奥地利帝国军队，取得普奥战争的决定性胜利。
- 在公民投票通过后，法国总统夏尔·戴高乐宣布正式承认阿尔及利亚为独立国家。
