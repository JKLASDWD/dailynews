news:
- 教宗意诺增爵四世发布教宗诏书，批准宗教裁判所得以针对异端嫌疑人士审讯用刑。
- 重浸派领袖托马斯·闵采尔率领的起义军在弗兰肯豪森战役遭到击败，德意志农民战争结束。
- 巴拉圭宣布脱离西班牙帝国在拉普拉塔总督辖区的殖民统治，并开始推动独立工作。
- 大日本帝国海军少壮派军官发动政变并暗杀内阁总理大臣犬养毅，五一五事件发生。
- 阿拉伯国家联合进攻甫刚在巴勒斯坦地区发表独立宣言的以色列，第一次中东战争爆发。
