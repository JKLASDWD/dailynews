news:
- 英格兰兰开斯特王朝国王亨利七世与约克王朝公主伊丽莎白结婚，玫瑰战争结束。
- 腓特烈一世加冕，成为普鲁士国王。
- 英国探险家詹姆士·库克发现夏威夷群岛，并将其命名为“桑威奇群岛”。
- 数个德意志邦国统一并成立德意志帝国，普鲁士国王威廉一世成为首任皇帝。
- 韩国釜山开始建造联合国纪念墓园，这是世上唯一的联合国墓地。
