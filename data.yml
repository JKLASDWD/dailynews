- 罗马帝国皇帝君士坦丁大帝正式宣布星期日为休息日，这也是纪念太阳神索尔的日子。
- 里奥布朗库子爵若泽·帕拉尼奥斯开始为期四年的巴西帝国总理任期，这是巴西历史上最长的总理任期。
- 美国专利及商标局授予加拿大发明家亚历山大·贝尔有关电话发明的专利。
- 纳粹德国军队违反《凡尔赛条约》及《洛迦诺公约》，进驻非军事区莱茵兰。
- 美国国家航空航天局的开普勒空间望远镜发射升空，其后用于发现类地行星。
