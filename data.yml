news:
- 在英格兰国王红发威廉意外逝世后，儒雅者亨利在威斯敏斯特教堂加冕成为英格兰国王。
- 英国探险家汉弗莱·吉尔伯特在纽芬兰与拉布拉多建立第一个英国美洲殖民地圣约翰斯。
- 俄罗斯帝国、普鲁士王国及哈布斯堡君主国开始第一次瓜分波兰，以在东欧达到权力平衡。
- 法国舰队司令李士卑斯率领三艘军舰强攻鸡笼，清法战争攻台战事爆发。
- 美国电影演员玛丽莲·梦露在洛杉矶因服用过量巴比妥类药物而逝世，成为著名阴谋论之一。
