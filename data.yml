news:
- 西罗马帝国将领欧瑞斯特率领联盟军队攻占西罗马帝国首都拉韦纳，皇帝尼波斯逃往达尔马提亚。
- 葡萄牙殖民者阿方索·德·阿尔布克尔克率军攻破马六甲，苏丹马末沙率领残部退守柔佛。
- 西班牙探险家在西属佛罗里达建立圣奥古斯丁，这座城市日后成为欧洲人在美洲大陆最古老的定居点。
- 英国议会通过《1833年废奴法令》，在印度以外的大英帝国全境废除奴隶制。
- 非裔美国人民权运动领袖马丁·路德·金在林肯纪念堂发表著名演讲《我有一个梦想》。
