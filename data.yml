news:
- 瓦拉几亚大公弗拉德三世率领军队夜袭奥斯曼帝国军营，试图刺杀其皇帝穆罕默德二世。
- 由法国雕塑家弗雷德里克·巴托尔迪创作的作品自由女神像自法国运抵美国纽约。
- 冰岛王国宣布结束丹麦国王克里斯蒂安十世的法理统治，并建立冰岛共和国。
- 冷战对东德经济的压力造成东柏林爆发反共运动，遭到苏军驻德集群与德国人民警察镇压。
- 美国共和党人员潜入华盛顿哥伦比亚特区水门综合大厦的民主党办公室时被捕，水门事件爆发。
