- 法国诺曼底公爵威廉一世的部队在黑斯廷斯之战击败哈罗德二世的英格兰军队，象征盎格鲁-撒克逊英格兰时代的结束。
- 受到暗杀元首阿道夫·希特勒的密谋案牵连，德国陆军元帅埃尔温·隆美尔选择自杀身亡。
- 列昂尼德·勃列日涅夫在向尼基塔·赫鲁晓夫发动政变后，继任成为苏联共产党中央委员会第一书记。
- 美国田径运动员吉姆·海因斯于奥运会男子100米决赛中以9.95秒成绩夺得金牌，成为采用电子计时后首位突破10秒大关的选手。
- Windows 11发布以后，美国微软公司宣布停止对长期服务版本以外的所有Windows 10版本提供版本支援。
