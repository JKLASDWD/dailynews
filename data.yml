character:
- 青娥娘娘之日
news:
- 东晋书法家王羲之与谢安、孙绰等名士举办集会，其后为此撰写《兰亭集序》。
- 为了防御英国军队进攻，法国国王查理五世下令在巴黎兴建防御工事巴士底。
- 对立教宗若望二十三世在康斯坦茨召集康斯坦茨大公会议，天主教会大分裂结束。
- 葡萄牙探险家佩德罗·卡布拉尔率领的船队到达巴西，并宣布该地属于葡萄牙。
- 德国军队在第二次伊珀尔战役使用氯气攻击协约国联军，为首次大规模化学武器攻击。
