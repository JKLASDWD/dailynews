news:
- 西班牙美洲殖民地在墨西哥成立上加利福尼亚省第一座农业城镇圣何塞。
- 随着《大日本帝国宪法》正式生效，采取两院制的最高立法机构帝国议会召开首次会议。
- 瑞士企业家胡安·甘伯在西班牙巴塞罗那成立巴塞罗那足球俱乐部。
- 联合国大会通过第181号决议，于巴勒斯坦地区分别建立犹太人国家及阿拉伯人国家。
- 大韩航空858号班机因被两名朝鲜特工安放定时炸弹而于安达曼海上空爆炸，机上115人全数罹难。
