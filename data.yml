news:
- 法国历史学家商博良在对法兰西文学院的演说中宣布破解罗塞塔石碑，埃及象形文沉寂千年之后再度得到破译。
- 美国福特汽车开始在密歇根州底特律工厂量产物美价廉的福特T型车，汽车得以社会各阶级普及。
- 纳粹德国、意大利王国、大日本帝国在柏林签署《三国同盟条约》，正式确立第二次世界大战中的轴心国同盟关系。
- 美国生物学家蕾切尔·卡森发表著作《寂静的春天》，控诉滴滴涕等化学农药对生态环境的危害，对环保运动影响深远。
- 昂山素季等人为反抗国家和平与发展委员会的军人独裁，成立了全国民主联盟。
