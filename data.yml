news:
- 在经总统选举当选后，乔治·华盛顿在美国纽约联邦国家纪念堂宣誓就任首任美国总统。
- 随着同盟国占领柏林，纳粹德国元首阿道夫·希特勒与妻子爱娃·布劳恩在元首地堡内自杀身亡。
- 哥伦比亚首都波哥大正式成立以美洲国家为成员的美洲国家组织，共有21个创始成员国。
- 越南民主共和国和越南南方民族解放阵线部队攻陷越南共和国首都西贡市，越南战争结束。
- 日本天皇明仁依《天皇退位等相关皇室典范特例法》正式退位，并由皇太子德仁亲王继位。
