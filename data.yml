news:
- 在与丹麦的玛格丽特结婚后，苏格兰国王詹姆斯三世获得奥克尼和设德兰两地。
- 在亨利八世逝世后，年仅9岁的爱德华六世在威斯敏斯特教堂加冕成为英格兰国王。
- 由意大利作曲家焦阿基诺·罗西尼创作的歌剧《塞维利亚的理发师》在罗马首次演出。
- 东北抗日联军成立。
- 受突尼斯茉莉花革命的影响，部分中国异见者发起中国茉莉花革命。
