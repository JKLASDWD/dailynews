news:
- 教宗若望二十二世开除与其长期对立的神圣罗马帝国皇帝路易四世的教籍。
- 大越权臣胡季犛逼迫皇帝陈少帝禅位并自立为大虞皇帝，陈朝宣告灭亡。
- 俄罗斯沙皇保罗一世在米哈伊洛夫宫遭到暗杀身亡，其子亚历山大一世继位。
- 中华奥林匹克委员会与国际奥林匹克委员会签署《洛桑协议》，中华民国政府正式接纳“中华台北”作为其日后参加国际体育赛事的正式官方名称。
- 俄罗斯联邦航天局的和平号空间站坠入地球大气层，并在太平洋上空解体。
