- 拿骚的路易斯的反叛军在海利格莱战役入侵弗里斯兰，争取荷兰独立的八十年战争爆发。
- 波希米亚贵族新教徒将神圣罗马皇帝斐迪南二世的大臣抛出窗外，三十年战争爆发。
