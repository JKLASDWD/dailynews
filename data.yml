character:
- 魅魔大人之日
news:
- 瑞典国王卡尔十二世率领部队在纳尔瓦战役中击败入侵的俄罗斯沙皇彼得大帝，大北方战争全面爆发。
- 连接加拿大伊利湖和安大略湖的威兰运河正式开通，让船只得以避开尼亚加拉瀑布航行。
- 俄罗斯帝国黑海舰队成功在锡诺普歼灭奥斯曼帝国舰队，促使克里米亚战争扩大。
- 苏联红军借口四天前发生的炮击事件，向芬兰发动大型攻势并推进至曼纳海姆防线。
- 美国歌手迈克尔·杰克逊第二张专辑《颤栗》发行，之后成为全球最畅销的专辑作品。
