news:
- 蒙古帝国的西征军队在蒂萨河之战中击败匈牙利王国国王贝拉四世的军队。
- 在英格兰王国爆发光荣革命后，威廉三世和玛丽二世在威斯敏斯特教堂加冕成为共治双王。
- 欧洲多个国家在荷兰乌德勒支签署《乌德勒支和约》，西班牙王位继承战争结束
- 第六次反法同盟与法国签署《枫丹白露条约》，拿破仑一世被流放至厄尔巴岛。
- 美国第三军团控制纳粹德国在威玛附近的布亨瓦德集中营，并释放里面的囚犯。
