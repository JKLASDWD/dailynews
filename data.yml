news:
- 波斯国王薛西斯一世的军队在温泉关战役击败斯巴达国王列奥尼达一世率领的部队。
- 梵蒂冈西斯廷小堂举行教宗选举秘密会议，选出亚历山大六世接替依诺增爵八世的教宗职务。
- 英国殖民者弗朗西斯·莱特在马来西亚槟岛建立殖民地乔治市，展开对英属马来亚的统治。
- 在魏玛共和国国民议会通过《魏玛宪法》后，首任总统弗里德里希·艾伯特正式签署生效。
- 约旦国民议会要求国王塔拉勒·伊本·阿卜杜拉退位，并由长子侯赛因·本·塔拉勒继承王位。
