news:
- 天主教会神父墨丘利当选成为教宗若望二世，是第一位使用名号即位的教宗。
- 卡斯蒂利亚王国和阿拉贡王国军队攻陷格拉纳达酋长国，收复失地运动结束。
- 在杜鲁诺佐约起义结束后，马打兰苏丹阿莽古拉特二世和朝臣处决杜鲁诺佐约。
- 苏联在拜科努尔航天发射场发射第一个星际探测器月球1号，并掠过月球上空。
- 美国空间探测器星尘号飞越维尔特二号彗星收集彗发尘埃，并携带样品返回地球。
