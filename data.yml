- 在禁卫军杀害苏尔皮基乌斯·加尔巴后，罗马元老院承认奥托为新任皇帝。
- 伊丽莎白一世在威斯敏斯特教堂加冕成为英格兰女王，为都铎王朝最后一位君主。
- 位于英国伦敦布卢姆茨伯里的大英博物馆正式开放，为世界规模最大的博物馆之一。
- 埃及阿斯旺水坝正式启用。水坝由苏联协助兴建，由时任埃及总统萨达特及当时苏联部长会议主席柯西金揭幕。
- 美国企业家吉米·威尔士和拉里·桑格推出采用Wiki技术的维基百科计划。
