news:
- 明朝第三代皇帝明成祖正式宣布定都北京，在重新建造的紫禁城在之后也宣告落成。
- 法国为了纪念《美国独立宣言》所制作的自由女神像在纽约港宣告落成。
- 国家法西斯党领袖贝尼托·墨索里尼号召数万名支持者进入罗马示威，翌日即获任命为意大利总理。
- 因希腊总理扬尼斯·梅塔克萨斯拒绝最后通牒，意大利总理贝尼托·墨索里尼下令发动入侵。
- 苏联共产党第一书记赫鲁晓夫宣布自古巴撤回所有武器，美国政府亦同意自土耳其及意大利撤回弹道导弹，古巴导弹危机落幕。
