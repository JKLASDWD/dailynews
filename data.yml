- 法兰西王国军队在法国炮兵指挥官让·布罗的指挥下于卡斯蒂永战役对英格兰王国军队取得决定性胜利，英格兰失去除加莱外所有欧洲大陆领土，进而结束了英法百年战争。
- 俄罗斯布尔什维克革命者处决关押在叶卡捷琳堡的罗曼诺夫王朝沙皇尼古拉二世及其家人。
