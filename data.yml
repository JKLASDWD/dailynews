- 神圣罗马帝国皇帝查理五世在秘鲁利马成立圣马尔科斯大学，为美洲最古老的大学。
- 日本借口八瑶湾事件出兵攻打台湾南部原住民部落，为日本明治维新后首次对外用兵。
- 法德双方在阿尼爆发激烈战斗，此战是当时战争史上最大规模的坦克会战。
- 苏联宣布解除对英国、美国、法国三国占领之西柏林的封锁，柏林封锁结束。
- 中国四川省阿坝藏族羌族自治州汶川县发生 8.3级强烈地震，造成超过6.9万人死亡。
