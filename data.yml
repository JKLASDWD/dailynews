news:
- 英格兰国王亨利七世在里士满宫因病逝世，其后次子亨利八世继承王位。
- 扎克里王朝国王拉玛一世将首都从吞武里迁至昭披耶河东岸，并建立新城市曼谷。
- 台湾新竹州南部发生里氏震级7.1的强烈地震，造成3,276人死亡、12,053人受伤，为台湾有史以来伤亡最惨重的自然灾害。
- 巴西政府将首都从里约热内卢迁往由建筑师卢西奥·科斯塔规划的新市镇巴西利亚。
- 希腊军官乔治斯·帕帕佐普洛斯等人发动军事政变夺取政权，其后建立希腊军政府。
