news:
- 丹麦通过实行君主立宪制国家的《丹麦王国宪法》，并建立两院制的丹麦议会。
- 越南阮朝皇帝嗣德帝与法国、西班牙签订《西贡条约》，不过张定等人持续对抗法国军队。
- 美国国务卿乔治·马歇尔在哈佛大学发表演讲，提出帮助欧洲战后重建的马歇尔计划。
- 以色列国防军对毗邻的埃及、约旦和叙利亚等国发动空袭及大规模入侵，最终成功占领东耶路撒冷、戈兰高地、西奈半岛、加沙地带、约旦河西岸等地。
- 美国物理学家埃里克·康奈尔和卡尔·威曼首次在铷-87原子蒸气中实现玻色–爱因斯坦凝聚。
