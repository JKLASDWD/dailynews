news:
- 波斯国王居鲁士二世率领阿契美尼德王朝军队占领新巴比伦王国所在地巴比伦。
- 以色列入侵埃及西奈半岛，并进逼苏伊士运河，第二次中东战争爆发。
- 英国首相撒切尔夫人宣布英国M25高速公路全线贯通，为英国最繁忙的高速公路。
- 伽利略号探测器在前往木星的过程中掠过小行星951，成为第一个造访小行星的人类飞行器。
- 飓风米奇袭击洪都拉斯、危地马拉和尼加拉瓜等地，造成超过11,000人死亡。
