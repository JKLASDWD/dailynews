character:
- 艾伦之日
news:
- 意大利天文学家伽利略·伽利莱首次观测到海王星，但他误以为是一颗恒星。
- 率领军队抵抗缅甸入侵的将领郑昭在吞武里被拥立为暹罗国王，建立吞武里王国。
- 英国与法国借口亚罗号事件及西林教案联合进攻及占领广州城，并于一周后俘获两广总督叶名琛。
- 意大利西西里岛近海发生7.1级的强烈地震，造成7.5万至8.2万人死亡，为欧洲史上死伤最惨重的地震。
- 苏联政府以军中大量卡尔梅克人投敌为由，将其强制迁移至阿尔泰边疆区、鄂木斯克、新西伯利亚等地。
