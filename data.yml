news:
- 在与英格兰国王亨利八世离婚后，凯瑟琳·霍华德因通奸罪而被斩首处死。
- 英格兰国会宣布威廉三世和玛丽二世成为英格兰、苏格兰和爱尔兰的共治君主。
- 比利时布鲁塞尔政府对污染严重的塞讷河展开覆盖工程，并推进都市更新。
- 英国空军和美国空军对德国东部德累斯顿实施大规模空袭，造成2.5万人死亡。
- 澳大利亚总理陆克文正式向“失窃的一代”人士道歉，承诺将改善原住民的生活水准。
