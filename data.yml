news:
- 葡萄牙王国贵族在里斯本发动反对西班牙统治的政变，并拥立若昂四世为新国王。
- 福特汽车开始使用世界上第一条用于汽车量产的移动装配线。
- 苏联革命者谢尔盖·基洛夫在列宁格勒遇刺身亡，促使约瑟夫·斯大林发动大清洗运动。
- 美国民权运动人士罗莎·帕克斯在亚拉巴马州蒙哥马利被捕，引发联合抵制公车运动。
- 欧洲隧道公司的工程团队打通横越英吉利海峡、全长50.45公里的英法海底隧道。
