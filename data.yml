news:
- 成功占领高卢地区的法兰克国王克洛维一世在巴黎逝世后，该地区分别由4个儿子分区统治。
- 教宗乌尔班二世在法国克莱蒙会议发表演说，号召基督教徒前去征讨进攻拜占庭帝国的穆斯林。
- 瑞典化学家阿尔弗雷德·诺贝尔在法国巴黎签署最后遗嘱，使用其大部分遗产设立诺贝尔奖。
- 美国LGBT权利运动人士，亦为首位公开同性恋身份的政治人物哈维·米尔克于办公室内遭枪杀身亡。
- 教宗若望·保禄二世将曾在4世纪担任君士坦丁堡普世牧首的约翰一世的圣髑归还给正教会。
