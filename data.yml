character:
- 蕾米莉亚之日
news:
- 大陆军将领亨利·诺克斯开始将纽约州提康德罗加堡的60吨火炮运往波士顿，以支援围攻波士顿的新英格兰民兵。
- 古典时期作曲家沃尔夫冈·阿马德乌斯·莫扎特在维也纳逝世，并留下尚未完成的《安魂曲》。
- 美国宪法第二十一修正案获得批准生效，第十八修正案遭到废除，美国禁酒时期结束。
- 英国伦敦发生严重空气污染，在随后四天内造成至少4,000人死亡。
- 斐济武装部队总司令弗兰克·姆拜尼马拉马发动军事政变，解除总理莱塞尼亚·恩加拉塞的职务。
