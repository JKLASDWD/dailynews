news:
- 朝鲜国王朝鲜世宗主导编整的《训民正音》出版，这些韩国语文字后来被称作“谚文”。
- 荷属东印度政府针对印度尼西亚巴达威亚华人展开大规模屠杀，造成超过10,000人死亡。
- 22国在瑞士签署《伯尔尼条约》以协调跨国邮政业务，万国邮政联盟由此诞生。
- 朝鲜民主主义人民共和国在咸镜北道舞水端里进行首次核试验，引来国际社会的普遍谴责。
- 巴基斯坦社会活动家马拉拉·尤萨夫扎伊遭到塔利班武装分子刺杀未遂。
