news:
- 由法兰克贵族组成的十字军在长达半年多的军事行动后攻下安条克。
- 在赫梅尔尼茨基起义期间，扎波罗热哥萨克在别列斯特赫科战役与波兰立陶宛联邦军队交战。
- 奥匈帝国皇储弗朗茨·斐迪南大公夫妇在萨拉热窝访问时遭到加夫里洛·普林齐普暗杀身亡。
- 各国代表在法国巴黎凡尔赛宫正式签署《凡尔赛条约》，协约国取得第一次世界大战胜利。
- 以色列政府在第三次中东战争结束后占领约旦管理的东耶路撒冷，从而统治耶路撒冷全部地区。
