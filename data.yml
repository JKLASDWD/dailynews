news:
- 埃及苏丹拜巴尔一世率领马木路克军队成功占领十字军国家安条克公国首都安条克。
- 法国颁布《共和十二年宪法》建立法兰西第一帝国，并由拿破仑·波拿巴担任皇帝。
- 在同盟国陆空攻势下，瓦迪斯瓦夫·安德斯的波兰第2军成功夺取意大利战略据点卡西诺山。
- 印度成功进行首次核试验，为首个于《不扩散核武器条约》生效后拥有核武器的国家。
- 美国华盛顿州斯卡梅尼亚县的圣海伦火山发生大规模喷发，造成57人死亡和11亿美元损失。
