news:
- 在君士坦丁九世逝世后，狄奥多拉女皇成为东罗马帝国唯一的统治者。
- 洪秀全在广西桂平发动反对清朝的金田起义，建立太平天国政权。
- 阿尔巴尼亚共产党总书记恩维尔·霍查宣布成立阿尔巴尼亚社会主义人民共和国。
- 连接纽约市皇后区与布朗克斯区的窄颈大桥开通。
- 中国隐身战机歼-20首次试飞。
