news:
- 罗马帝国石匠圣马力诺斯在蒂塔诺山修建独立的修道院社群，其后成为圣马力诺的前身。
- 埃及马穆鲁克苏丹国军队在巴勒斯坦北部的阿音札鲁特战役中击败蒙古帝国的西征军队。
- 英国国王乔治三世的代表和美国代表在法国巴黎签订《巴黎条约》，美国独立战争宣告结束。
- 非裔美国人弗雷德里克·道格拉斯逃离奴隶制，日后成为废奴运动的领导人之一。
- 俄罗斯特种部队攻入车臣武装分子三日前在北奥塞梯别斯兰占领的一所中学，期间人质与恐怖分子共396人死亡。
