- 英格兰第三代约克公爵的军队在第一次圣奥尔本斯战役抓获国王亨利六世，玫瑰战争爆发。
- 智利中部瓦尔迪维亚附近发生9.4至9.6级强烈地震，为人类历史上已知规模最大的地震。
