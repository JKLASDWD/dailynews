news:
- 罗马共和国独裁官尤利乌斯·恺撒规定开始使用儒略历，取代旧有的罗马历。
- 大不列颠王国和爱尔兰王国根据《联合法令》建立大不列颠暨爱尔兰联合王国。
- 英国在澳大利亚的六个海外殖民地合并成立澳大利亚联邦，埃德蒙·巴顿成为首任总理。
- 菲德尔·卡斯特罗领导的革命军控制古巴首都哈瓦那，富尔亨西奥·巴蒂斯塔政权垮台。
- 德国、法国、意大利、荷兰等12个欧洲联盟成员国组成的欧元区正式启用欧元。
