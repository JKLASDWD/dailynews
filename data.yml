- 纳粹德国军队发起冬季风暴作战，尝试救出在斯大林格勒战役中遭包围的轴心国军队。
- 韩国陆军少将全斗焕发动军事政变，逮捕与其不和的陆军参谋总长郑昇和，实质掌握韩国军政权力。
