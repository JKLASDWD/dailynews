- 波西米亚国王，卢森堡的查理四世在纽伦堡颁布了黄金诏书。
- 美国思想家托马斯·潘恩出版小册子《常识》，主张十三殖民地自大英帝国独立。
- 法兰西第三共和国国防政府将领安托万·尚兹在萨尔特省的勒芒地区与普鲁士的腓特烈·卡尔所率领之北德意志联邦及普鲁士王国联军爆发决定性的勒芒战役。
- 联合国大会在英国伦敦卫理公会中央礼堂召开首次会议，共计56个会员国代表参与。
- 中国神舟二号无人飞船发射成功。
