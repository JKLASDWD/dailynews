news:
- 为了对抗英国议会通过不可容忍法令，12个北美洲殖民地代表在费城木匠厅召开大陆会议。
- 法国海军在切萨皮克湾海战击败英国皇家海军，致英国陆军于约克镇围城战役覆灭，法美联军赢得战争。
- 日本和俄罗斯代表在美国总统西奥多·罗斯福调停下签署《朴茨茅斯和约》，日俄战争结束。
- 在塞内加尔自马里联邦独立后不久，诗人利奥波德·塞达尔·桑戈尔当选成为首任塞内加尔总统。
- 巴勒斯坦恐怖组织黑色九月在西德杀害参加夏季奥林匹克运动会的11名以色列代表团成员。
