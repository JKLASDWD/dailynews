news:
- 苏莱曼一世率领的奥斯曼军队在第一次摩哈赤战役击败匈牙利国王暨波西米亚国王拉约什二世率领的联军。
- 普鲁士国王腓特烈二世率领军队突然入侵邻近的萨克森，七年战争爆发。
- 清朝与英国代表签署《南京条约》结束第一次鸦片战争，香港割让给英国并开放五口通商。
- 苏联在哈萨克斯坦塞米巴拉金斯克基地完成RDS-1原子弹核试验，引发与美国间的核军备竞赛。
- 颶風卡特里娜袭击美国路易斯安那州与密西西比州沿岸地区，造成至少1,836人死亡。
