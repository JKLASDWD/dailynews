news:
- 君士坦丁大帝在尼西亚召开第一次尼西亚公会议，确立《尼西亚信经》并谴责阿利乌教派。
- 葡萄牙探险家瓦斯科·达伽马抵达莫卧儿帝国科泽科德，开辟直接与远东展开贸易的航道。
- 由亚伯拉罕·奥特柳斯编纂的《寰宇全图》正式发行，被认为是史上第一部现代地图集。
- 美国总统亚伯拉罕·林肯正式签署《宅地法》生效，西部垦殖者可以获得160英亩土地。
- 法国病毒学家吕克·蒙塔尼耶的团队发现人类免疫缺陷病毒，但仍未知悉其与艾滋病的关联。
