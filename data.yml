news:
- 在苏格兰独立战争期间，英国国王爱德华一世在伦敦处死苏格兰民族英雄威廉·华莱士。
- 普鲁士在普奥战争击败奥地利帝国，双方签署《布拉格条约》并解散德意志邦联。
