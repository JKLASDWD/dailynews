news:
- 在教宗玛尔定五世逝世后，教宗选举秘密会议选举安日纳四世为新任教宗。
- 位于怀俄明州的肖肖尼国家森林正式成立，为美国第一个受到联邦保护的国家森林。
- 美国国会正式将《星条旗》定为美国国歌，取代原先经常使用的《哥伦比亚万岁》。
- 苏俄与同盟国签署《布列斯特-立陶夫斯克条约》，彻底退出第一次世界大战。
- 香港首次举行教师语文能力评核，所有本港在职英语及普通话教师，必须考试及格后，方可继续任教有关科目。
