news:
- 亨利七世的兰开斯特军队在博斯沃思原野战役击败理查三世的约克部队，玫瑰战争结束。
- 法国在美洲的殖民地法属圣多明戈爆发大规模黑人奴隶暴动，海地革命爆发。
- 在红十字国际委员会创始人亨利·杜南倡导下，12个国家在瑞士签署《日内瓦第一公约》。
- 大韩帝国总理李完用与大日本帝国代表寺内正毅签订《日韩合并条约》，日本吞并韩国。
- 在爱尔兰内战期间，国民军总司令麦可·柯林斯在经过家乡科克郡途中遭遇伏击而逝世。
