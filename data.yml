news:
- 为了纪念征服喀山汗国，位于俄罗斯莫斯科红场的圣瓦西里主教座堂正式完工。
- 巴伐利亚、符腾堡、美茵兹、巴登等16个公国成立莱茵邦联，并脱离神圣罗马帝国。
- 德国党卫军和苏联红军在普罗霍罗夫卡战役中交战，成为规模最大的坦克会战之一。
- 太平洋西部吉尔伯特群岛正式脱离英国统治而独立，国名定为基里巴斯共和国。
- 黎巴嫩真主党游击队跨越蓝线掳获两名以色列士兵，以色列对黎巴嫩南部展开军事行动。
