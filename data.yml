news:
- 亨利二世在伦敦威斯敏斯特教堂加冕成为英格兰国王，开创中世纪英格兰实力最强大的金雀花王朝。
- 法国陆军在经过两个多月的围城，成功攻陷土伦港，拿破仑·波拿巴在此战后升为准将。
- 美国国家航空航天局的阿波罗17号指挥舱成功返回地球，阿波罗计划宣告结束。
- 加拿大导演詹姆斯·卡梅隆执导的《泰坦尼克号》首映，最终全球总票房收入达18亿美元。
- 美国众议院以涉嫌于莱温斯基丑闻中妨碍司法公正及伪证为由，通过弹劾总统比尔·克林顿。
