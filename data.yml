news:
- 古罗马知名哲学家及演说家西塞罗因主张维持共和制，遭马克·安东尼派人于福尔米亚刺杀身亡。
- 大日本帝国海军针对美国太平洋舰队总部所在地夏威夷领地珍珠港发动突袭作战，太平洋战争爆发。
- 随着在第二次国共内战中逐渐战败，中华民国政府宣布各机关从中国大陆迁往台湾台北市。
- 西德总理维利·勃兰特于造访华沙犹太区起义纪念碑时自发下跪，为纳粹德国侵略期间的死难者默哀。
- 印度尼西亚国民军以反对殖民统治为由入侵东帝汶，展开长达25年的军事占领。
