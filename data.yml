news:
- 意大利文艺复兴时期画家米开朗基罗在西斯廷礼拜堂完成壁画《创世纪》的绘制工作。
- 葡萄牙探险家斐迪南·麦哲伦率领舰队驶入南美洲与火地群岛间的海峡，其后被命名为“麦哲伦海峡”。
- 葡萄牙里斯本近海发生9.0级的强烈地震，造成约10万人死亡，并促成往后地震学与地震工程的发展。
- 法属阿尔及利亚民族解放阵线起兵反抗法国统治，阿尔及利亚战争爆发。
- 由12个欧洲共同体国家共同签署的《马斯特里赫特条约》生效，欧洲联盟正式成立。
