news:
- 葡萄牙航海家费尔南多·麦哲伦率领船队离开西班牙塞维利亚，开始环游世界航行。
- 瑞典海军战舰瓦萨号为了参与三十年战争而快速赶工，但在斯德哥尔摩展开首航不久便沉没。
- 法国巴黎自治政府和国民自卫军攻入杜伊勒里宫并逮捕国王路易十六，最终导致波旁王朝瓦解。
- 法国政府决定将巴黎的卢浮宫作为博物馆向公众开放，后来成为参观人数最多的艺术博物馆。
- 奥斯曼帝国与协约国代表签署《塞夫尔条约》，被迫承认第一次世界大战后的分裂安排。
