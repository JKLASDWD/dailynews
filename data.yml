- 辽朝将领耶律大石指挥契丹与葛逻禄军队在卡特万之战中击败塞尔柱帝国与喀喇汗国组成的伊斯兰联军。
- 葡萄牙航海家瓦斯科·达伽马首次自印度返回葡萄牙，在首都里斯本受到市民的热烈欢迎。
- 瑞士、英国等10个国家在伯恩签订关于著作权保护的《伯恩保护文学和艺术作品公约》。
- 日本中国派遣军总司令冈村宁次向中华民国陆军总司令何应钦递交投降书，中国抗日战争结束。
- 秋收起义49周年之际，中国共产党中央委员会主席毛泽东逝世，终年82岁。
