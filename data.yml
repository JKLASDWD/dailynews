news:
- 辽太宗派遣部队协助针对后唐皇帝李从珂的反叛行动后，册封石敬瑭为后晋皇帝。
- 斯坎德培假借奥斯曼帝国苏丹穆拉德二世的名义，率领阿尔巴尼亚骑兵占领克鲁亚。
- 波义耳与胡克等12名科学家于伦敦格雷沙姆学院决定组织学会，后来发展为皇家学会。
- 南希·阿斯特正式就任英国下议院议员，成为英国史上首位女性国会议员。
- 新西兰航空901号班机在南极洲埃里伯斯火山撞山坠毁，机上257人全部罹难。
