news:
- 英格兰国王哈罗德二世在斯坦福桥战役中击败挪威军队，挪威国王哈拉尔三世阵亡，结束了维京人在英格兰的统治。
- 瓦斯科·努涅斯·德·巴尔沃亚穿过巴拿马地峡，成为第一个看见太平洋的欧洲人。
- 中国南部的徽班为了庆祝乾隆帝80岁生日而前往北京表演，成为后来京剧的基础。
- 德国的AVUS路投入使用，是为世界第一条高速公路。
- 莫桑比克解放阵线在与葡萄牙的政治谈判破裂后，决定进入葡属东非北部地区展开游击战。
