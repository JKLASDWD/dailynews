news:
- 法国将军让·莫罗领导的法军在霍恩林登战役对神圣罗马帝国军队取得决定性的胜利，迫使第二次反法同盟的崩溃。
- 澳门群众与警方爆发严重警民冲突，随后演变为反对澳葡政府的大规模动乱，造成至少8人死亡，200余人受伤。
- 南非医师克里斯蒂安·巴纳德于开普敦完成世界首例心脏移植手术。
- 美国国家航空航天局的空间探测器先驱者10号将第一批木星照片传至地球。
- 美国联合碳化物设于印度博帕尔的工厂发生氰化物泄漏事故，造成至少3,787人死亡，受影响人数估计超过55万人。
