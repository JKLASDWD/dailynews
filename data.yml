news:
- 英格兰国王爱德华三世创建嘉德勋章制度，为英国荣誉体系级别最高的骑士勋章。
- 在英国议会宣布复辟斯图亚特王朝后，查理二世在威斯敏斯特教堂加冕成为新任国王。
- 爱尔兰物理学家威廉·哈密顿发表论文《光线系统理论》，建立光学的数学理论。
- 在渡江战役期间，中国共产党领导的中国人民解放军占领中华民国首都南京市。
- 美国工程师贾德·卡林姆在影音分享网站YouTube上传第一支视频《我在动物园》。
