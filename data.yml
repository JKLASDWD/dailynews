news:
- 蒂雷纳子爵指挥的法军主力部队开始入侵荷兰，宣告荷兰黄金时代的结束。
- 法国巴黎凡尔赛宫召开法国三级会议讨论财政危机的应对，最终导致法国大革命的爆发。
- 意大利军队成功攻占埃塞俄比亚首都亚的斯亚贝巴，第二次意大利埃塞俄比亚战争结束。
- 英国、法国等10个欧洲国家在伦敦签订《欧洲委员会法规》，成立欧洲统合机构欧洲委员会。
- 美国太空人艾伦·谢泼德搭乘水星-红石3号进入亚轨道飞行，成为第二位进入外太空的太空人。
