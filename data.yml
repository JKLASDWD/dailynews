news:
- 英格兰王国国王亨利八世第二任妻子安妮·博林因为通奸罪等罪名，在伦敦塔遭到斩首处死。
- 在三十年战争期间，法国名将路易二世·德·波旁-孔代率领军队在罗克鲁瓦战役中击败西班牙军队。
- 英国残缺议会宣布废除君主制和上议院，并在英格兰和威尔士正式建立英格兰共和国。
- 法兰西第一共和国第一执政拿破仑·波拿巴设立法国荣誉军团勋章，表彰有贡献的军人和平民。
- 凯末尔·阿塔图尔克在萨姆松发起抵抗奥斯曼帝国分裂的土耳其国民运动，土耳其独立战争爆发。
