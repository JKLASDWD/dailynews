news:
- 在历经长达8年的兴建，位在英国首都伦敦、横跨泰晤士河的悬索桥伦敦塔桥正式启用。
- 德国物理学家阿尔伯特·爱因斯坦发表《论动体的电动力学》，首次提出狭义相对论。
- 俄罗斯西伯利亚石泉通古斯河附近发生通古斯大爆炸，2,150多平方公里的森林焚毁倾倒。
- 阿道夫·希特勒派遣德国纳粹党党卫队打击恩斯特·罗姆等冲锋队成员，造成至少85人死亡。
- 为了让协调世界时与太阳日实际情况相符，国际时间局第一次引入闰秒调整系统。
