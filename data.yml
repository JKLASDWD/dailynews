news:
- 伊斯兰教创始人穆罕默德带领麦地那军队在巴德尔之役中击败麦加的古莱什军队。
- 英国天文学家威廉·赫歇尔在位于索美塞特郡的自宅庭院发现新的行星天王星。
- 俄罗斯民意党成员伊格纳西·赫里涅维茨基等人成功刺杀沙皇亚历山大二世。
- 蒙古国在罗曼·冯·恩琴的领导下，宣布脱离中华民国，外蒙古独立。
- 日本福岛第一核电厂1号机组受三陆冲大地震影响发生冷却系统故障，导致反应堆心温度无法控制，在日本时间下午3时36分4左右，冒出白烟后传出爆炸声响，有4人受伤，并造成辐射外泄。
