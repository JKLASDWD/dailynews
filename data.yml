- 日本战国大名织田信长在本能寺遭到其家臣明智光秀率领军队围攻，被迫自杀身亡。
- 法国国王路易十六和玛丽·安托瓦内特从巴黎杜伊勒里宫出逃，但在阿戈讷地区瓦雷讷遭到逮捕。
- 阿瑟·韦尔斯利的英国、葡萄牙和西班牙联军在维多利亚战役击败约瑟夫·波拿巴的法国军队。
- 为了避免遭协约国扣押，德意志帝国海军上将路德维希·冯·罗伊特下令将公海舰队集体自沉。
- 美国工程师伯特·鲁坦设计的太空船1号成为首部私人研制且进入次轨道的载人航天器。
