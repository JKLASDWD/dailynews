news:
- 英国国王亨利八世下令处决前掌礼大臣托马斯·克伦威尔，并在同日与凯瑟琳·霍华德结婚。
- 马克西米连·罗伯斯庇尔、路易·安托万·德·圣茹斯特等法国雅各宾俱乐部成员遭到处决，宣告法国大革命中最激进的雅各宾专政时期结束。
- 阿根廷将军何塞·德·圣马丁宣布秘鲁自西班牙帝国独立，并与西门·玻利瓦尔领导独立战争。
- 奥匈帝国依照最后通牒向拒绝调查萨拉热窝事件的塞尔维亚王国宣战，第一次世界大战爆发。
- 中国大陆河北省唐山市和丰南县先后发生7.5级与7.4级大地震，造成超过24万人死亡和16万人受伤。
