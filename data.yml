- 德国作曲家乔治·弗里德里希·亨德尔的清唱剧《弥赛亚》在爱尔兰都柏林首演。
- 英国议会通过的《天主教解放法案》正式颁布，解除对天主教会信徒的限制。
- 黎巴嫩长枪党和解放巴勒斯坦人民阵线在贝鲁特发生冲突，黎巴嫩内战爆发。
