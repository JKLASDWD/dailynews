news:
- 荷兰共和国、法兰西王国和大不列颠王国在海牙组成对抗西班牙的三国同盟。
- 被卖为奴隶的非裔美国人所罗门·诺萨普重获自由，其口述回忆录《为奴十二年》成为描述奴隶制度的代表性著作。
- 英国青年知识分子在伦敦成立费边社，主张透过渐进改良方式走向社会主义。
- 美国音乐杂志《公告牌》首次公布音乐榜单，后来成为西洋音乐界重要的评比依据。
- 位于阿拉伯联合酋长国迪拜境内的哈利法塔完工启用，为世界最高的结构物。
