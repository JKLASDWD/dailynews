news:
- 武则天在神都洛阳登极成为皇帝，取代唐朝建立武周，以遭废黜的唐睿宗为“皇嗣”。
- 拿破仑·波拿巴率领法国军队在德国莱比锡与第六次反法同盟作战，莱比锡战役爆发。
- 洛伊·O·迪士尼与华特·迪士尼在美国好莱坞创立动画工作室华特迪士尼公司。
- 美国田径选手汤米·史密斯与约翰·卡洛斯于奥运会男子200米比赛颁奖仪式演奏美国国歌时高举戴着黑色手套的拳头，被视为近代奥运史上最明确的政治声明。
- 原先担任波兰克拉科夫总教区总主教的卡罗尔·若瑟·沃伊蒂瓦枢机当选成为教宗若望·保禄二世，成为450年来首位非意大利人出身的教宗。
