- 法国诺曼底公爵威廉一世率领部队登陆英格兰萨塞克斯郡佩文西，诺曼征服英格兰战争爆发。
- 谭嗣同、林旭等6名维新派人士，被慈禧太后下令押到北京菜市口作为“乱臣贼子”斩首。
