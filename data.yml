news:
- 英国不列颠东印度公司军队在普拉西战役中击败莫卧儿帝国军队，其后展开对印度的统治。
- 在法国历史学家皮埃尔·德·顾拜旦的发起下，国际奥林匹克委员会在巴黎大学宣布正式成立。
- 由12个国家签订的《南极条约体系》正式生效，禁止在南极洲进行军事活动。
- 在Sonic Team的游戏《音速小子》首部作品发布后，日本游戏公司世嘉获得巨大成功。
- 英国举行有关欧洲联盟成员资格的公民投票，最终有51.9％的选民投票支持脱离欧洲联盟。
