news:
- 大日本帝国军队向香港、菲律宾、关岛等地发动大规模攻势，美国、英国及英联邦成员国向大日本帝国宣战。
- 英国披头士乐队前成员约翰·列侬于纽约达科他公寓自宅外遭歌迷马克·大卫·查普曼枪杀身亡。
- 一辆以色列运兵车于北加沙省的检查站附近压死四名巴勒斯坦难民，引发巴勒斯坦人长达数年的大规模抗议及暴动。
- 白俄罗斯、俄罗斯和乌克兰领导人签订协议，同意解散苏联，并建立继承权利的独立国家联合体。
- 日本女子偶像团体AKB48于东京进行出道公演，之后获得吉尼斯世界纪录认证为世界上最多成员的流行音乐团体。
