news:
- 罗马帝国皇帝狄奥多西一世在米兰逝世，其后帝国疆域分成西部和东部。
- 法国国王查理九世和摄政凯瑟琳·德·麦地奇颁布停止宗教迫害的《圣日耳曼赦令》。
- 英国探险家詹姆士·库克的决心号在第二次探险途中，创下横跨南极圈的纪录。
- 在美国和比利时政府密谋下，刚果共和国前总理帕特里斯·卢蒙巴在加丹加省遭到杀害。
- 在联合国授权下，以美国为首的多国部队对入侵科威特的伊拉克军队发动空袭。
