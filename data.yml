- 俄罗斯革命家弗拉迪米尔·列宁从瑞士返回彼得格勒，并领导布尔什维克革命。
- 韩裔美国学生赵承熙在弗吉尼亚理工学院暨州立大学发动枪击案，造成33人死亡。
