news:
- 征服者埃尔南·科尔特斯的西班牙军队攻陷阿兹特克首都特诺奇提特兰，皇帝夸乌特莫克投降。
- 阿拉贡王国神学家米格尔·塞尔韦特在日内瓦参加约翰·加尔文的布道会时遭到逮捕。
- 在西班牙王位继承战争期间，约翰·丘吉尔的奥格斯堡同盟联军在布伦汉姆战役取得关键胜利。
- 日本军在上海市以上海租界和军舰为基地向中国守军发起攻击，淞沪会战爆发。
- 东德政府开始围绕西柏林建造柏林墙，借由隔离墙封锁东柏林和西柏林的交通往来。
