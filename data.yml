news:
- 位于今耶路撒冷旧城围墙旁的基督教圣墓教堂遭到信奉伊斯兰教的法蒂玛王朝拆除。
- 法国国王路易十四签署颁布《枫丹白露敕令》，废除对新教的宽容政策。
- 法国、英国、荷兰和奥地利签署《第二亚琛和约》，从而结束奥地利王位继承战争。
- 英法联军统帅詹姆斯·布鲁斯下令部队焚烧清朝大型皇家园林圆明园。
- 曾参与军事政变而获得领导权的阿根廷政治人物胡安·庇隆与女演员伊娃·庇隆结婚。
