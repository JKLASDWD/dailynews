- 拜占庭皇帝狄奥多西二世下令将聂斯脱里主义创始人聂斯脱里从君士坦丁堡流放至埃及。
- 意大利航海家克里斯托弗·哥伦布率领船队离开西班牙，开始穿越大西洋的远航。
