news:
- 罗马帝国军队在条顿堡森林战役惨败于日耳曼人部族联军。
- 第一次苏格兰独立战争期间，安德鲁·莫瑞与威廉·华莱士率领农民起义军在斯特灵桥之役以寡击众，战胜了拥有大量骑兵的英格兰军。
- 法兰西王国陆军与奥格斯堡同盟联军在马尔普拉凯战役交战，前者被迫撤出战场，但后者死伤惨重，使此战成为军史中著名的皮洛士式胜利。
- 智利陆军总司令奥古斯托·皮诺切特发动军事政变，迫使总统萨尔瓦多·阿连德自杀，进而建立军政府。
- “基地”组织针对美国纽约与华盛顿哥伦比亚特区目标发动一系列自杀式恐怖攻击，造成2,996人死亡。
