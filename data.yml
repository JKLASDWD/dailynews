news:
- 蒙古帝国征服军队在卡利奇克河附近成功击败由基辅罗斯、加利西亚和钦察等组成的联军。
- 在法国大革命期间，国民公会为了审判政治犯而在巴黎成立的革命法庭遭到撤销。
- 英国开普殖民地、纳塔尔殖民地、德兰士瓦殖民地等四个殖民地正式合并成为南非联邦。
- 英国自治领南非联邦根据《南非宪法》退出英联邦王国，南非共和国正式成立。
- 韩国和日本主办的国际足联世界杯在汉城举办开幕式，为首次两国联合举办的世界杯赛事。
