news:
- 英格兰国王理查一世在出兵包围沙吕沙布罗勒城堡时重伤，并于十天后逝世。
- 在杀害约翰·科明后，苏格兰贵族罗伯特一世在斯昆自行加冕成为苏格兰国王。
- 荷兰天文学家克里斯蒂安·惠更斯使用其设计的望远镜发现土星的卫星土卫六。
- 希腊圣拉伏拉修道院号召伯罗奔尼撒等地向奥斯曼帝国发动革命，希腊独立战争爆发。
- 纽约三角内衣工厂火灾，146名工人（其中129名为女性）命丧火窟。
