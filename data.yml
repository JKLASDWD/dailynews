news:
- 在经过30年的建设后，由法国皇帝拿破仑一世下令兴建的巴黎凯旋门举行落成典礼。
- 日本江户幕府与美国驻日公使汤森·哈里斯签订《美日修好通商条约》，其后数月亦陆续与荷兰、俄罗斯、英国、法国签订类似的不平等条约。
- 国际原子能总署在奥地利首都维也纳正式成立，旨在推动核结合能的和平使用。
- 美国总统德怀特·艾森豪威尔签署《美国国家航空航天法案》，建立美国国家航空航天局。
- 英国王储暨威尔士亲王查尔斯和威尔士王妃戴安娜在伦敦圣保罗座堂举行婚礼。
