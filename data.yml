news:
- 急于求和的南宋在绍兴和议中同意接受金朝提出的条件，从而结束宋金战争。
- 在胡斯战争中领导波希米亚反抗国王西吉斯蒙德和天主教会的扬·杰式卡在进攻摩拉维亚的过程中身亡。
- 牙买加的黑人因为判决不公与英国殖民当局爆发暴力冲突，愤怒的黑人焚烧了法院和附近的建筑物。
- 教宗若望二十三世召开梵蒂冈第二届大公会议，希望革新教会以呼应现代社会的需要。
- 香港总督卫奕信在立法局宣布玫瑰园计划，斥巨资填海建造赤鱲角机场及配套工程。
