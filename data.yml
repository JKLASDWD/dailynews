news:
- 苏莱曼一世在君士坦丁堡登基成为奥斯曼帝国苏丹兼哈里发，在他的治理下帝国走向全盛。
- 普鲁士总理奥托·冯·俾斯麦发表铁血演说，宣称德意志统一不能通过演说与投票完成，而必须用“血与铁”来实现。
- 纳粹德国、法西斯意大利与英国、法国缔结《慕尼黑协定》，英国首相张伯伦宣称其带来了“我们时代的和平”。
- 印尼陆军少将苏哈托成功镇压军事政变后，掀起大规模反共与排华浪潮并实质掌握军政权力。
- 连接香港石硖尾站到观塘站的修正早期系统正式通车，为香港地铁系统首条营运路线。
