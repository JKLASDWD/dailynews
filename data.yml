news:
- 捷克宗教改革家扬·胡斯因为被康斯坦茨大公会议视为异端，在德国康斯坦茨受火刑处死。
- 英格兰宗教改革反对者托马斯·莫尔因拒绝接受国王亨利八世兼任教会领袖而被处死。
- 法国微生物学家路易·巴斯德首次向被犬只咬伤的9岁儿童注射其发明的狂犬病疫苗。
- 英国保护地尼亚萨兰宣布正式脱离英国成为独立国家马拉维，并保留英联邦成员国身份。
- 伊斯兰国家科摩罗宣布正式脱离法兰西第五共和国成为独立国家，而马约特转为领土集体。
