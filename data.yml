news:
- 东罗马帝国皇帝查士丁尼一世逮捕君士坦丁堡普世牧首尤提齐乌斯，并将其流放。
- 教宗儒略二世建立直辖的宗座瑞士近卫队，负责保护教宗国的独立地位。
- 英国维多利亚女王去世，其长子爱德华七世继承王位。
- 埃沃·莫拉莱斯就任玻利维亚总统，成为该国第一位美洲原住民总统。
- 日本HTV-2货运飞船发射。
