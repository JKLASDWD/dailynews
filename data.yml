news:
- 教宗良三世在罗马圣伯多禄大殿加冕法兰克国王查理曼为神圣罗马皇帝。
- 根据爱德蒙·哈雷的预测，观测到了一颗后来被命名为哈雷彗星的彗星。
- 香港总督杨慕琦率领英国军队在半岛酒店向日本军无条件投降，香港日占时期开始。
- 罗马尼亚共产党总书记尼古拉·齐奥塞斯库及其妻子埃列娜·齐奥塞斯库遭支持救国阵线的士兵枪决。
- 俄罗斯总统弗拉基米尔·普京签署法案，同意将苏联国歌改编版定为《俄罗斯联邦国歌》。
