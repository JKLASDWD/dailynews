news:
- 清朝代表索额图与俄罗斯代表费岳多在尼布楚签订界定两国边界的《尼布楚条约》。
- 大陆军总司令乔治·华盛顿派出海龟号潜艇，试图攻击停靠在纽约港的英国皇家海军军舰。
- 法国皇帝拿破仑一世率领大军团在博罗金诺战役重创俄罗斯军队，随后攻占莫斯科。
- 在八国联军占领北京城的情况下，清朝政府和英国、美国等11个国家签订《辛丑条约》。
- 纳粹德国在不列颠战役中改变战略，对英国首都伦敦展开大规模轰炸。
