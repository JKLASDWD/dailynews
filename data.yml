news:
- 英国探险队在北美洲东岸弗吉尼亚建设城镇詹姆士敦，是英国美洲殖民地首个定居点。
- 路易十四继承父亲路易十三的法国王位，开始其长达72年的统治。
- 英国医师爱德华·詹纳首次将牛痘接种在一名男童身上，证实牛痘可使人类对天花免疫。
- 戴维·本-古里安在特拉维夫宣读《以色列独立宣言》，正式在巴勒斯坦托管地建立犹太国家。
- 苏联、波兰等8个东方集团国家成立华沙条约组织，用来对抗北大西洋公约组织。
