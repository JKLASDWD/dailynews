- 塔希提王国国王波马雷五世被迫签署文件放弃王位，塔希提及其附近领土成为法国属地。
- 英国直辖殖民地塞舌尔在经协商后宣布脱离英国独立，并成为英联邦的成员国。
- 韩国首都汉城瑞草区瑞草洞的三丰百货店发生倒塌事故，造成502人死亡和937人受伤。
- 大韩民国海军与朝鲜人民军海军在临近北方界线的延坪岛海域发生武装冲突。
- 美国苹果公司研制的智能手机iPhone在美国上市，该公司也因而成为市值最高的公司。
