- 美利坚联盟国军队开始炮轰位于南卡罗来纳州查尔斯顿的萨姆特堡，南北战争爆发。
- 苏联太空人尤里·加加林乘坐东方一号进入外层空间，完成世界上首次载人太空飞行。
