news:
- 美国海军陆战队派遣部队登陆瓜达尔卡纳尔岛、图拉吉岛等岛屿，瓜达尔卡纳尔岛战役爆发。
- 挪威人类学家托尔·海尔达尔率领的木筏探险队从秘鲁卡亚俄横跨太平洋抵达土亚莫土群岛。
- 美国驻坦桑尼亚达累斯萨拉姆和肯尼亚内罗毕的大使馆同时遭遇汽车炸弹袭击，造成225人死亡。
- 格鲁吉亚部队违反停火条件攻击南奧塞梯与阿布哈兹，其后因俄罗斯介入导致战争升级。
- 中度台风莫拉克侵袭台湾，持续数日的破纪录降雨引发大规模水灾与土石流灾情，造成681人死亡。
