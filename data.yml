news:
- 英格兰国王约翰在封建贵族胁迫下，于温莎城堡附近的兰尼米德签署权利法案《大宪章》。
- 天主教会教宗良十世发表诏书要求马丁·路德撤销《九十五条论纲》，否则将被实行绝罚。
- 法国医生让-巴蒂斯特·德尼为15岁男孩输入绵羊血液，成为人类首次进行的输血治疗。
- 在执政不久的腓特烈三世因为头颈癌逝世后，其子威廉二世继位德意志皇帝兼普鲁士国王。
- 经过意大利、比利时和法国足球协会的协商，欧洲足球联合会联盟在瑞士巴塞尔宣告成立。
