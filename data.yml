- 阿拔斯帝国哈里发曼苏尔将都城从幼发拉底河河畔的安巴尔迁往巴格达。
- 布拉格市民在胡斯派领导下反抗神圣罗马皇帝西吉斯蒙德的统治，胡斯战争爆发。
- 日本大正天皇接替因为糖尿病逝世的明治天皇即位，年号亦从明治改为大正。
- 乌拉圭国家足球队在决赛以4比2击败阿根廷国家足球队，赢得首届国际足联世界杯冠军。
- 美国阿波罗十五号航天员大卫·斯科特和詹姆斯·艾尔文登陆月球，并首次驾驶阿波罗月球车。
