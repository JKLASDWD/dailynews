- 中国人民解放军炮击驻守金门县的中华民国国军，金门炮战爆发。
- 苏联加盟共和国爱沙尼亚、拉脱维亚和立陶宛200余万人组成超过600千米长的人链，宣示其追求脱离苏联独立的决心。
